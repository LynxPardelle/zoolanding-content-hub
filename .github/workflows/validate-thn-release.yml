name: Validate THN release boundary (no deploy)

on:
  pull_request:
  push:
    branches: [codex/thn-offline-blog-20260907]

permissions:
  contents: read

concurrency:
  group: thn-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run required runtime and release suites without credentials
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-release.txt
          python -m pip check
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s tests_release -p 'test_*.py'
