name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
      - name: Validate content hub config
        shell: bash
        env:
          CONTENT_HUB_CONFIG_JSON_BASE64: ${{ secrets.CONTENT_HUB_CONFIG_JSON_BASE64 }}
          CONTENT_HUB_CONFIG_READY: ${{ vars.CONTENT_HUB_CONFIG_READY }}
          CONTENT_HUB_ENVIRONMENT: dev
          AUTH_SESSION_TABLE_NAME: ${{ vars.AUTH_SESSION_TABLE_NAME }}
          AUTH_USER_STATE_TABLE_NAME: ${{ vars.AUTH_USER_STATE_TABLE_NAME }}
        run: |
          set -euo pipefail
          test "${CONTENT_HUB_CONFIG_READY:-}" = "true" || { echo "CONTENT_HUB_CONFIG_READY=true is required for deploy"; exit 1; }
          test -n "${AUTH_SESSION_TABLE_NAME:-}" || { echo "AUTH_SESSION_TABLE_NAME is required for deploy"; exit 1; }
          test -n "${AUTH_USER_STATE_TABLE_NAME:-}" || { echo "AUTH_USER_STATE_TABLE_NAME is required for deploy"; exit 1; }
          output_path="$RUNNER_TEMP/content-hub-config.compact.b64"
          export OUTPUT_CONFIG_PATH="$output_path"
          python - <<'PY'
          import base64, json, os, pathlib
          import lambda_function as content_hub
          raw = os.environ.get("CONTENT_HUB_CONFIG_JSON_BASE64", "")
          if not raw:
              raise SystemExit("CONTENT_HUB_CONFIG_JSON_BASE64 is required for deploy")
          decoded = base64.b64decode(raw).decode("utf-8")
          parsed = json.loads(decoded)
          content_hub.load_config()
          compact = json.dumps(parsed, separators=(",", ":")).encode("utf-8")
          pathlib.Path(os.environ["OUTPUT_CONFIG_PATH"]).write_text(base64.b64encode(compact).decode("ascii"), encoding="utf-8")
          PY
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Test and deploy
        shell: bash
        env:
          AUTH_SESSION_TABLE_NAME: ${{ vars.AUTH_SESSION_TABLE_NAME }}
          AUTH_USER_STATE_TABLE_NAME: ${{ vars.AUTH_USER_STATE_TABLE_NAME }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"
          sam validate
          sam build --no-cached
          CONTENT_HUB_CONFIG_JSON_BASE64="$(cat "$RUNNER_TEMP/content-hub-config.compact.b64")"
          sam deploy --config-env dev --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "EnvironmentName=dev" "ContentHubConfigJsonBase64=${CONTENT_HUB_CONFIG_JSON_BASE64}" "AuthSessionTableName=${AUTH_SESSION_TABLE_NAME}" "AuthUserStateTableName=${AUTH_USER_STATE_TABLE_NAME}" "LogLevel=INFO"

