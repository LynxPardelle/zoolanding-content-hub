      Role:
        Fn::GetAtt:
          - ContentHubFunctionRole
          - Arn
      Environment:
        Variables:
          CONTENT_HUB_ENVIRONMENT:
            Ref: EnvironmentName
          CONTENT_HUB_CONFIG_JSON_BASE64:
            Ref: ContentHubConfigJsonBase64
          AUTH_SESSION_TABLE_NAME:
            Ref: AuthSessionTableName
          AUTH_USER_STATE_TABLE_NAME:
            Ref: AuthUserStateTableName
          CONTENT_HUB_METADATA_TABLE_NAME:
            Ref: ContentHubMetadataTable
          CONTENT_HUB_MEDIA_TABLE_NAME:
            Ref: ContentHubMediaTable
          CONTENT_HUB_MODERATION_TABLE_NAME:
            Ref: ContentHubModerationTable
          CONTENT_HUB_INTERACTIONS_TABLE_NAME:
            Ref: ContentHubInteractionsTable
          CONTENT_HUB_PACKAGES_BUCKET_NAME:
            Ref: ContentHubPackagesBucket
          LOG_LEVEL:
            Ref: LogLevel
      Events:
        Read:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: POST
            Path: /features/content-hub/read
        Action:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: POST
            Path: /features/content-hub/action
        PublicAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: POST
            Path: /features/content-hub/public-action
        OptionsRead:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: OPTIONS
            Path: /features/content-hub/read
        OptionsAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: OPTIONS
            Path: /features/content-hub/action
        OptionsPublicAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: OPTIONS
            Path: /features/content-hub/public-action

  DueSchedulesRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-DueScheduleRunner
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn:
            Fn::GetAtt:
              - ContentHubFunction
              - Arn
          Id: ContentHubFunctionDueSchedulesTarget
          Input: '{"contentHubTask":"runDueSchedules"}'

  DueSchedulesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ContentHubFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - DueSchedulesRule
          - Arn

Outputs:
  ApiEndpoint:
    Description: Content hub HTTP API endpoint.
    Value:
      Fn::Sub: https://${ContentHubApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  FunctionName:
    Description: Content hub Lambda function name.
    Value:
      Ref: ContentHubFunction
  MetadataTableName:
    Description: Content hub metadata table name.
    Value:
      Ref: ContentHubMetadataTable
  MediaTableName:
    Description: Content hub media table name.
    Value:
      Ref: ContentHubMediaTable
  ModerationTableName:
    Description: Content hub moderation table name.
    Value:
      Ref: ContentHubModerationTable
  InteractionsTableName:
    Description: Content hub interactions table name.
    Value:
      Ref: ContentHubInteractionsTable
  PackagesBucketName:
    Description: Content hub package bucket name.
    Value:
      Ref: ContentHubPackagesBucket
  ThnContentHubV2MetadataTableArn:
    Condition: IsThnContentHubV2StateProvisioned
    Description: Exact retained THN Content Hub v2 private metadata table ARN.
    Value:
      Fn::GetAtt:
        - ThnContentHubV2MetadataTable
        - Arn
  ThnContentHubV2AuditTableName:
    Condition: IsThnContentHubV2StateProvisioned
    Description: Exact retained THN Content Hub v2 audit table name.
    Value:
      Ref: ThnContentHubV2AuditTable
  ThnContentHubV2PrivateStoreName:
    Condition: IsThnContentHubV2StateProvisioned
    Description: Exact retained THN Content Hub v2 private object-store name.
    Value:
      Ref: ThnContentHubV2PrivateStore
  ThnContentHubV2AuthoringFunctionArn:
    Condition: IsThnContentHubV2Enabled
    Description: Protected owner-only THN Content Hub v2 authoring function ARN.
    Value:
      Fn::GetAtt:
        - ThnContentHubV2AuthoringFunction
        - Arn
  ThnContentHubV2PublisherFunctionArn:
    Condition: IsThnContentHubV2Enabled
    Description: Sole THN Content Hub v2 public-projection publisher ARN.
    Value:
      Fn::GetAtt:
        - ThnContentHubV2PublisherFunction
        - Arn
  ThnContentHubV2PublicMediaFunctionArn:
    Condition: IsThnContentHubV2Enabled
    Description: Read-only THN Content Hub v2 public-media origin ARN.
    Value:
      Fn::GetAtt:
        - ThnContentHubV2PublicMediaFunction
        - Arn
  ThnContentHubV2EmergencyWithdrawFunctionArn:
    Condition: IsThnContentHubV2Enabled
    Description: Operator-only THN Content Hub v2 emergency-withdraw function ARN.
    Value:
      Fn::GetAtt:
        - ThnContentHubV2EmergencyWithdrawFunction
        - Arn
