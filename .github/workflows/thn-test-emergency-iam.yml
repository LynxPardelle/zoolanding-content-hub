name: THN TEST Emergency Registry Reader IAM Review

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [review, execute]
      expected_source_sha:
        type: string
        required: true
      review_run_id:
        type: string
        required: false
      approved_digest:
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: zoolanding-content-hub-test
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require exact TEST source and guarded inputs
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.expected_source_sha }}
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          APPROVED_DIGEST: ${{ inputs.approved_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/test
          test "$GITHUB_REPOSITORY" = LynxPardelle/zoolanding-content-hub
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$OPERATION" == execute ]]; then
            [[ "$REVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$APPROVED_DIGEST" =~ ^[a-f0-9]{64}$ ]]
          else
            test -z "$REVIEW_RUN_ID"
            test -z "$APPROVED_DIGEST"
          fi
      - name: Install pinned review dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - name: Run exact IAM patch offline guards
        run: |
          python -m unittest discover -s tests -p test_thn_production_iam_patch.py
          python -m unittest discover -s tests -p test_thn_test_emergency_iam.py

  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: test
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      APPROVED_DIGEST: ${{ inputs.approved_digest }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SAM_ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
      GH_TOKEN: ${{ github.token }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Recheck reviewed source before AWS
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/test
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$AWS_ROLE_ARN" = "arn:aws:iam::765932874577:role/zoolanding-content-hub-test-deploy"
          test -z "$(git status --porcelain)"
      - name: Verify previous review before download
        if: inputs.operation == 'execute'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN_ID" > "$RUNNER_TEMP/review-run.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'review-run.json').read_text())
          assert value['event'] == 'workflow_dispatch'
          assert value['head_branch'] == 'test' and value['head_sha'] == os.environ['EXPECTED_SOURCE_SHA']
          assert value['path'] == '.github/workflows/thn-test-emergency-iam.yml'
          assert value['status'] == 'completed' and value['conclusion'] == 'success'
          PY
          gh run download "$REVIEW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "thn-test-emergency-iam-review-$REVIEW_RUN_ID" --dir retained-review
          test "$(find retained-review -type f | wc -l)" = 1
          cp retained-review/test-emergency-iam-review.json test-emergency-iam-review.json
      - name: Install pinned release dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '765932874577'
      - name: Review or execute one IAM policy modification
        env:
          OPERATION: ${{ inputs.operation }}
        run: python tools/thn_test_emergency_iam.py "$OPERATION"
      - name: Save sanitized retained review
        if: inputs.operation == 'review'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thn-test-emergency-iam-review-${{ github.run_id }}
          path: test-emergency-iam-review.json
          retention-days: 7
          if-no-files-found: error
