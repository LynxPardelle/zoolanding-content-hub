name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: thn-production-retained-hub
  cancel-in-progress: false

jobs:
  guard:
    outputs:
      mode: ${{ steps.promotion.outputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Require exact reviewed TEST promotion and compatible source scope
        id: promotion
        shell: bash
        env:
          PRODUCTION_PROMOTION_SELECTION_JSON: ${{ vars.HUB_PRODUCTION_PROMOTION_SELECTION_JSON }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PUSH_FORCED" != "true"
          git fetch --no-tags origin refs/heads/test:refs/remotes/origin/test
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$GITHUB_SHA"
          test -n "$first_parent" && test -n "$second_parent" && test -z "${extra:-}"
          test "$first_parent" = "$BEFORE_SHA"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/test)"
          PROMOTED_SOURCE_SHA="$second_parent"
          PROMOTED_SOURCE_TREE="$(git rev-parse 'refs/remotes/origin/test^{tree}')"
          PROMOTED_TARGET_BASE_SHA="$first_parent"
          PROMOTED_MERGE_TREE="$(git merge-tree --write-tree "$first_parent" "$second_parent")"
          test "$PROMOTED_MERGE_TREE" = "$(git rev-parse 'HEAD^{tree}')"
          export PROMOTED_SOURCE_SHA PROMOTED_SOURCE_TREE PROMOTED_TARGET_BASE_SHA PROMOTED_MERGE_TREE
          mode="$(python tools/classify_production_promotion.py)"
          case "$mode" in
            thn-source-only|v1-preserve-published-at) ;;
            *) exit 1 ;;
          esac
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Validate promoted source without AWS credentials
        run: |
          python -m unittest discover -s tests -p 'test_classify_production_promotion.py'
          python -m unittest discover -s tests -p 'test_v1_publication_date_patch.py'
          python -m unittest discover -s tests -p 'test_v1_publication_date_release.py'

  deploy:
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.mode == 'v1-preserve-published-at'
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_PROMOTION_SELECTION_JSON: ${{ vars.HUB_PRODUCTION_PROMOTION_SELECTION_JSON }}
      BEFORE_SHA: ${{ github.event.before }}
      PUSH_FORCED: ${{ github.event.forced }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up SAM
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: '1.163.0'
          use-installer: true
          token: ${{ github.token }}
      - name: Test exact source and existing role before AWS credentials
        shell: bash
        env:
          CONTENT_HUB_CONFIG_READY: ${{ vars.CONTENT_HUB_CONFIG_READY }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$CONTENT_HUB_CONFIG_READY" = true
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-release.txt -r requirements-test.txt pip-audit
          python -m unittest discover -s tests -p "test_*.py"
          pip-audit -r requirements.txt
          sam validate
          python tools/release_v1_publication_date.py check
          python - <<'PY'
          import os
          from tools.thn_production_service import CONFIG
          from tools.thn_production_release import ACCOUNT
          if os.environ['AWS_ROLE_ARN']!='arn:aws:iam::'+ACCOUNT+':role/'+CONFIG['deployRole']:
              raise SystemExit('v1_existing_role_mismatch')
          PY
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '765932874577'
      - name: Prepare sealed v1 artifact and validate native Code-only preview
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_v1_publication_date.py prepare --pointer "$RUNNER_TEMP/v1-date-private-pointer.json" --receipt "$RUNNER_TEMP/v1-date-public-receipt.json"
      - name: Execute exact retained preview after fresh source and CodeSha checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/release_v1_publication_date.py execute --pointer "$RUNNER_TEMP/v1-date-private-pointer.json" --receipt "$RUNNER_TEMP/v1-date-public-receipt.json"
      - name: Publish sanitized release evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-publication-date-${{ github.run_id }}
          path: ${{ runner.temp }}/v1-date-public-receipt.json
          retention-days: 30
          if-no-files-found: ignore
