name: Validate Test promotion (no deploy)

on:
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: zoolanding-content-hub-test
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      SAM_CLI_TELEMETRY: 0
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.identity.outputs.name }}
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          version: 1.163.0
          use-installer: true
          token: ${{ github.token }}
      - name: Verify exact TEST promotion context
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "release_sha_invalid"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/test"
          test "$PUSH_FORCED" != "true"
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test -n "$commit"
          test -n "$first_parent"
          test -n "$second_parent"
          test -z "${extra:-}"
          test "$first_parent" = "$BEFORE_SHA"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/remotes/origin/dev^{tree}')"
      - name: Test, validate, and build exact source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-release.txt
          python -m pip check
          python -m unittest discover -s tests -p "test_*.py"
          python -m unittest discover -s tests_release -p "test_*.py"
          python -m venv "$RUNNER_TEMP/thn-cfn-lint"
          "$RUNNER_TEMP/thn-cfn-lint/bin/python" -m pip install --disable-pip-version-check cfn-lint==1.56.0
          "$RUNNER_TEMP/thn-cfn-lint/bin/cfn-lint" -t template.yaml -r us-east-1
          sam build --no-cached
          python tools/check_lambda_artifacts.py
      - name: Assemble immutable validation artifact
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          SERVICE_ID: zoolanding-content-hub
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "schema": "zoolanding-test-validation/v1",
              "purpose": "validation-only",
              "deployable": False,
              "service": os.environ["SERVICE_ID"],
              "source_sha": os.environ["RELEASE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(".aws-sam/build/release-metadata.json").write_text(
              json.dumps(payload, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > .aws-sam/build-manifest.sha256
      - name: Compute validation identity
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum .aws-sam/build-manifest.sha256 | cut -d ' ' -f 1)"
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || { echo "manifest_digest_invalid"; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Define artifact name
        id: identity
        shell: bash
        env:
          ARTIFACT_NAME: zoolanding-content-hub-test-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: printf 'name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload exact validated artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.name }}
          path: |
            .aws-sam/build/
            .aws-sam/build-manifest.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-artifact:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Validate immutable artifact coordinates
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "source_sha_invalid"; exit 1; }
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo "artifact_id_invalid"; exit 1; }
          [[ "$EXPECTED_MANIFEST_DIGEST" =~ ^[a-f0-9]{64}$ ]] || { echo "manifest_digest_invalid"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/test"
      - name: Download exact artifact by immutable ID
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: .aws-sam
          merge-multiple: true
      - name: Verify transported artifact and source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          EXPECTED_SERVICE: zoolanding-content-hub
        run: |
          set -euo pipefail
          test -z "$(find .aws-sam -type l -print -quit)"
          (cd .aws-sam/build && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/recomputed-build-manifest.sha256"
          cmp --silent .aws-sam/build-manifest.sha256 "$RUNNER_TEMP/recomputed-build-manifest.sha256"
          printf '%s  %s\n' "$EXPECTED_MANIFEST_DIGEST" .aws-sam/build-manifest.sha256 | sha256sum --check --strict -
          (cd .aws-sam/build && sha256sum --check --strict ../build-manifest.sha256)
          python3 - "$EXPECTED_SHA" "$EXPECTED_SERVICE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import json
          from pathlib import Path
          import sys
          payload = json.loads(Path(".aws-sam/build/release-metadata.json").read_text(encoding="utf-8"))
          if (
              payload.get("schema") != "zoolanding-test-validation/v1"
              or payload.get("purpose") != "validation-only"
              or payload.get("deployable") is not False
              or payload.get("source_sha") != sys.argv[1]
              or payload.get("service") != sys.argv[2]
              or payload.get("run_id") != sys.argv[3]
              or payload.get("run_attempt") != sys.argv[4]
          ):
              raise SystemExit("validation_metadata_invalid")
          PY
      - name: Record validation-only artifact coordinates
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          MANIFEST_DIGEST: ${{ needs.validate.outputs.manifest_digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### TEST source validation only"
            echo "- source_run_id: $GITHUB_RUN_ID"
            echo "- source_artifact_id: $ARTIFACT_ID"
            echo "- source_sha: $RELEASE_SHA"
            echo "- source_manifest_sha256: $MANIFEST_DIGEST"
            echo "- This is not a deployment or rollback artifact; no AWS operation ran."
          } >> "$GITHUB_STEP_SUMMARY"
