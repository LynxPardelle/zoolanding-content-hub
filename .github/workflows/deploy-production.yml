name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    outputs:
      mode: ${{ steps.promotion.outputs.mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Require exact source-only TEST promotion
        id: promotion
        shell: bash
        env:
          PRODUCTION_PROMOTION_SELECTION_JSON: ${{ vars.HUB_PRODUCTION_PROMOTION_SELECTION_JSON }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PUSH_FORCED" != "true"
          git fetch --no-tags origin refs/heads/test:refs/remotes/origin/test
          read -r commit first_parent second_parent extra < <(git rev-list --parents -n 1 HEAD)
          test "$commit" = "$GITHUB_SHA"
          test -n "$first_parent" && test -n "$second_parent" && test -z "${extra:-}"
          test "$first_parent" = "$BEFORE_SHA"
          test "$second_parent" = "$(git rev-parse refs/remotes/origin/test)"
          PROMOTED_SOURCE_SHA="$second_parent"
          PROMOTED_SOURCE_TREE="$(git rev-parse 'refs/remotes/origin/test^{tree}')"
          PROMOTED_TARGET_BASE_SHA="$first_parent"
          PROMOTED_MERGE_TREE="$(git merge-tree --write-tree "$first_parent" "$second_parent")"
          test "$PROMOTED_MERGE_TREE" = "$(git rev-parse 'HEAD^{tree}')"
          export PROMOTED_SOURCE_SHA PROMOTED_SOURCE_TREE PROMOTED_TARGET_BASE_SHA PROMOTED_MERGE_TREE
          mode="$(python tools/classify_production_promotion.py)"
          test "$mode" = "thn-source-only"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Validate promoted source without AWS credentials
        run: python -m unittest discover -s tests -p 'test_classify_production_promotion.py'

  deploy:
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.mode != 'thn-source-only'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up SAM
        uses: aws-actions/setup-sam@v3
      - name: Validate content hub config
        shell: bash
        env:
          CONTENT_HUB_CONFIG_JSON_BASE64: ${{ secrets.CONTENT_HUB_CONFIG_JSON_BASE64 }}
          CONTENT_HUB_CONFIG_READY: ${{ vars.CONTENT_HUB_CONFIG_READY }}
          CONTENT_HUB_ENVIRONMENT: prod
          AUTH_SESSION_TABLE_NAME: ${{ vars.AUTH_SESSION_TABLE_NAME }}
          AUTH_USER_STATE_TABLE_NAME: ${{ vars.AUTH_USER_STATE_TABLE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${CONTENT_HUB_CONFIG_READY:-}" != "true" ]]; then
            echo "Skipping deploy: CONTENT_HUB_CONFIG_READY is not true for this environment."
            exit 0
          fi
          test -n "${AUTH_SESSION_TABLE_NAME:-}" || { echo "AUTH_SESSION_TABLE_NAME is required for deploy"; exit 1; }
          test -n "${AUTH_USER_STATE_TABLE_NAME:-}" || { echo "AUTH_USER_STATE_TABLE_NAME is required for deploy"; exit 1; }
          output_path="$RUNNER_TEMP/content-hub-config.compact.b64"
          export OUTPUT_CONFIG_PATH="$output_path"
          python - <<'PY'
          import base64, json, os, pathlib
          import lambda_function as content_hub
          raw = os.environ.get("CONTENT_HUB_CONFIG_JSON_BASE64", "")
          if not raw:
              raise SystemExit("CONTENT_HUB_CONFIG_JSON_BASE64 is required for deploy")
          decoded = base64.b64decode(raw).decode("utf-8")
          parsed = json.loads(decoded)
          content_hub.load_config()
          compact = json.dumps(parsed, separators=(",", ":")).encode("utf-8")
          pathlib.Path(os.environ["OUTPUT_CONFIG_PATH"]).write_text(base64.b64encode(compact).decode("ascii"), encoding="utf-8")
          PY
      - name: Configure AWS credentials
        if: vars.CONTENT_HUB_CONFIG_READY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Test and deploy
        if: vars.CONTENT_HUB_CONFIG_READY == 'true'
        shell: bash
        env:
          AUTH_SESSION_TABLE_NAME: ${{ vars.AUTH_SESSION_TABLE_NAME }}
          AUTH_USER_STATE_TABLE_NAME: ${{ vars.AUTH_USER_STATE_TABLE_NAME }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py"
          sam validate
          sam build --no-cached
          CONTENT_HUB_CONFIG_JSON_BASE64="$(cat "$RUNNER_TEMP/content-hub-config.compact.b64")"
          sam deploy --config-env prod --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides "EnvironmentName=prod" "ContentHubConfigJsonBase64=${CONTENT_HUB_CONFIG_JSON_BASE64}" "AuthSessionTableName=${AUTH_SESSION_TABLE_NAME}" "AuthUserStateTableName=${AUTH_USER_STATE_TABLE_NAME}" "LogLevel=INFO"
