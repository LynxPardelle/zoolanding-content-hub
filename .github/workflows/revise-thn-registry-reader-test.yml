name: Revise THN registry reader in TEST

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Reviewed full commit SHA already promoted to TEST
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zoolanding-content-hub-test
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-24.04
    environment: test
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      ARTIFACTS_BUCKET: ${{ vars.SAM_ARTIFACTS_BUCKET }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify exact reviewed TEST source before credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LynxPardelle/zoolanding-content-hub'
          test "$GITHUB_REF" = 'refs/heads/test'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install pinned policy-revision dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt
      - name: Recheck policy-only source contract before credentials
        run: python -m unittest tests_release.test_registry_release_read_policy tests_release.test_thn_registry_reader_revision
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Apply one reviewed existing-table policy revision
        run: python -m tools.thn_registry_reader_revision --operation apply
