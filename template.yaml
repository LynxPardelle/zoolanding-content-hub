AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic content hub BFF for protected content authoring flows

Parameters:
  EnvironmentName:
    Type: String
    Default: test
    AllowedValues:
      - test
      - prod
  ContentHubConfigJsonBase64:
    Type: String
    Default: eyJ2ZXJzaW9uIjoxLCJwcm9maWxlcyI6W119
    NoEcho: true
  AuthSessionTableName:
    Type: String
  AuthUserStateTableName:
    Type: String
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
  FunctionMemorySize:
    Type: Number
    Default: 512
    MinValue: 256
    MaxValue: 1024
    Description: Lambda memory in MB. Higher memory gives more CPU for the boto3/DynamoDB cold read path.
  ServiceBindingRegistryOperatorRoleArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/zoolanding-thn-registry-test-operator$'
    Description: Exact TEST operator/OIDC role ARN allowed to invoke only the private registry mutation Lambda.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize:
      Ref: FunctionMemorySize
    Tracing: PassThrough

Conditions:
  IsTestEnvironment:
    Fn::Equals:
      - Ref: EnvironmentName
      - test
  HasServiceBindingRegistryOperatorRole:
    Fn::And:
      - Condition: IsTestEnvironment
      - Fn::Equals:
          - Ref: ServiceBindingRegistryOperatorRoleArn
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-thn-registry-test-operator

Resources:
  ContentHubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: EnvironmentName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ServiceBindingRegistryV2Table:
    Type: AWS::DynamoDB::Table
    Condition: IsTestEnvironment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: zoolanding-content-hub-test-ServiceBindingRegistryV2
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      ResourcePolicy:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowRegistryMutationFunctionDescribe
              Effect: Allow
              Principal:
                AWS:
                  Fn::GetAtt:
                    - ServiceBindingRegistryV2MutationRole
                    - Arn
              Action:
                - dynamodb:DescribeTable
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ArnEquals:
                  aws:PrincipalArn:
                    Fn::GetAtt:
                      - ServiceBindingRegistryV2MutationRole
                      - Arn
            - Sid: AllowRegistryMutationFunctionExactBinding
              Effect: Allow
              Principal:
                AWS:
                  Fn::GetAtt:
                    - ServiceBindingRegistryV2MutationRole
                    - Arn
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ArnEquals:
                  aws:PrincipalArn:
                    Fn::GetAtt:
                      - ServiceBindingRegistryV2MutationRole
                      - Arn
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - SERVICE_BINDING#test#thn-journal-test-v2
            - Sid: AllowRegistryConditionCheckForMutationRoles
              Effect: Allow
              Principal: '*'
              Action:
                - dynamodb:ConditionCheckItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ArnEquals:
                  aws:PrincipalArn:
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-image-upload-test-ThnImageUploadV2Role
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2AuthoringRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PrivateAssetCollectorRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PublisherRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2InvalidationWorkerRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2EmergencyWithdrawRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PreparedOrphanCollectorRole
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - SERVICE_BINDING#test#thn-journal-test-v2
                StringEquals:
                  dynamodb:EnclosingOperation: TransactWriteItems
                StringEqualsIfExists:
                  dynamodb:ReturnValues: NONE
            - Sid: DenyRegistryConditionCheckOutsideApprovedMutationRoles
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:ConditionCheckItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-image-upload-test-ThnImageUploadV2Role
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2AuthoringRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PrivateAssetCollectorRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PublisherRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2InvalidationWorkerRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2EmergencyWithdrawRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PreparedOrphanCollectorRole
            - Sid: DenyRegistryConditionCheckOutsideExactBindingKey
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:ConditionCheckItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ForAllValues:StringNotEquals:
                  dynamodb:LeadingKeys:
                    - SERVICE_BINDING#test#thn-journal-test-v2
            - Sid: DenyRegistryConditionCheckOutsideTransaction
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:ConditionCheckItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                StringNotEqualsIfExists:
                  dynamodb:EnclosingOperation: TransactWriteItems
            - Sid: DenyRegistryConditionCheckFailureValues
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:ConditionCheckItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                StringEquals:
                  dynamodb:ReturnValues: ALL_OLD
            - Sid: DenyRegistryAccessOutsideMutationFunction
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:BatchExecuteStatement
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:DeleteItem
                - dynamodb:DescribeTable
                - dynamodb:ExecuteStatement
                - dynamodb:PartiQLDelete
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLSelect
                - dynamodb:PartiQLUpdate
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:TransactGetItems
                - dynamodb:UpdateItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    Fn::GetAtt:
                      - ServiceBindingRegistryV2MutationRole
                      - Arn
            - Sid: DenyRegistryGetItemOutsideApprovedConsumers
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:GetItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ArnNotEquals:
                  aws:PrincipalArn:
                    - Fn::GetAtt:
                        - ServiceBindingRegistryV2MutationRole
                        - Arn
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-image-upload-test-ThnImageUploadV2Role
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2AuthoringRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PrivateAssetCollectorRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PublisherRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PublicMediaRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2InvalidationWorkerRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2EmergencyWithdrawRole
                    - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-content-hub-test-ThnContentHubV2PreparedOrphanCollectorRole
            - Sid: DenyRegistryUnsupportedReads
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:BatchGetItem
                - dynamodb:PartiQLSelect
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:TransactGetItems
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
            - Sid: DenyRegistryPutOutsideExactBindingKey
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:PutItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                ForAllValues:StringNotEquals:
                  dynamodb:LeadingKeys:
                    - SERVICE_BINDING#test#thn-journal-test-v2
            - Sid: DenyRegistryUpdateItem
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:UpdateItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
            - Sid: DenyRegistryPutInsideTransaction
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:PutItem
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              Condition:
                StringEquals:
                  dynamodb:EnclosingOperation: TransactWriteItems
            - Sid: DenyRegistryDeleteAndBatchWrite
              Effect: Deny
              Principal: '*'
              Action:
                - dynamodb:BatchExecuteStatement
                - dynamodb:BatchWriteItem
                - dynamodb:DeleteItem
                - dynamodb:ExecuteStatement
                - dynamodb:PartiQLDelete
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLUpdate
              Resource:
                Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2

  ServiceBindingRegistryV2MutationRole:
    Type: AWS::IAM::Role
    Condition: IsTestEnvironment
    Properties:
      RoleName: zoolanding-thn-registry-test-mutation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ExactThnRegistryMutation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeExactThnRegistry
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
              - Sid: ReadWriteExactThnBinding
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/zoolanding-content-hub-test-ServiceBindingRegistryV2
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys:
                      - SERVICE_BINDING#test#thn-journal-test-v2

  ServiceBindingRegistryV2MutationFunction:
    Type: AWS::Serverless::Function
    Condition: IsTestEnvironment
    Properties:
      CodeUri: .
      Handler: service_binding_registry_operator_lambda.lambda_handler
      FunctionName: zoolanding-content-hub-test-ThnServiceBindingRegistryV2Mutation
      Description: Private direct-invocation boundary for exact conditional THN registry mutations.
      Role:
        Fn::GetAtt:
          - ServiceBindingRegistryV2MutationRole
          - Arn

  ServiceBindingRegistryOperatorInvokePolicy:
    Type: AWS::IAM::Policy
    Condition: HasServiceBindingRegistryOperatorRole
    Properties:
      PolicyName: InvokeExactThnRegistryMutation
      Roles:
        - zoolanding-thn-registry-test-operator
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InvokeExactPrivateRegistryMutation
            Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              Fn::GetAtt:
                - ServiceBindingRegistryV2MutationFunction
                - Arn

  ServiceBindingRegistryOperatorInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: HasServiceBindingRegistryOperatorRole
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ServiceBindingRegistryV2MutationFunction
      Principal:
        Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-thn-registry-test-operator

  ContentHubMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ContentHubMediaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ContentHubModerationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ContentHubInteractionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  ContentHubPackagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  ContentHubFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-FunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ContentHubPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
                  - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - Fn::GetAtt:
                      - ContentHubMetadataTable
                      - Arn
                  - Fn::GetAtt:
                      - ContentHubMediaTable
                      - Arn
                  - Fn::GetAtt:
                      - ContentHubModerationTable
                      - Arn
                  - Fn::GetAtt:
                      - ContentHubInteractionsTable
                      - Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub: ${ContentHubPackagesBucket.Arn}/content-hubs/${EnvironmentName}/*

  ContentHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      FunctionName:
        Fn::Sub: ${AWS::StackName}-Function
      Description: Provides protected generic content hub read/action workflows for Zoolanding drafts.
      Role:
        Fn::GetAtt:
          - ContentHubFunctionRole
          - Arn
      Environment:
        Variables:
          CONTENT_HUB_ENVIRONMENT:
            Ref: EnvironmentName
          CONTENT_HUB_CONFIG_JSON_BASE64:
            Ref: ContentHubConfigJsonBase64
          AUTH_SESSION_TABLE_NAME:
            Ref: AuthSessionTableName
          AUTH_USER_STATE_TABLE_NAME:
            Ref: AuthUserStateTableName
          CONTENT_HUB_METADATA_TABLE_NAME:
            Ref: ContentHubMetadataTable
          CONTENT_HUB_MEDIA_TABLE_NAME:
            Ref: ContentHubMediaTable
          CONTENT_HUB_MODERATION_TABLE_NAME:
            Ref: ContentHubModerationTable
          CONTENT_HUB_INTERACTIONS_TABLE_NAME:
            Ref: ContentHubInteractionsTable
          CONTENT_HUB_PACKAGES_BUCKET_NAME:
            Ref: ContentHubPackagesBucket
          LOG_LEVEL:
            Ref: LogLevel
      Events:
        Read:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: POST
            Path: /features/content-hub/read
        Action:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: POST
            Path: /features/content-hub/action
        PublicAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: POST
            Path: /features/content-hub/public-action
        OptionsRead:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: OPTIONS
            Path: /features/content-hub/read
        OptionsAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: OPTIONS
            Path: /features/content-hub/action
        OptionsPublicAction:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: ContentHubApi
            Method: OPTIONS
            Path: /features/content-hub/public-action

  DueSchedulesRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-DueScheduleRunner
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Arn:
            Fn::GetAtt:
              - ContentHubFunction
              - Arn
          Id: ContentHubFunctionDueSchedulesTarget
          Input: '{"contentHubTask":"runDueSchedules"}'

  DueSchedulesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ContentHubFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - DueSchedulesRule
          - Arn

Outputs:
  ApiEndpoint:
    Description: Content hub HTTP API endpoint.
    Value:
      Fn::Sub: https://${ContentHubApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  FunctionName:
    Description: Content hub Lambda function name.
    Value:
      Ref: ContentHubFunction
  MetadataTableName:
    Description: Content hub metadata table name.
    Value:
      Ref: ContentHubMetadataTable
  MediaTableName:
    Description: Content hub media table name.
    Value:
      Ref: ContentHubMediaTable
  ModerationTableName:
    Description: Content hub moderation table name.
    Value:
      Ref: ContentHubModerationTable
  InteractionsTableName:
    Description: Content hub interactions table name.
    Value:
      Ref: ContentHubInteractionsTable
  PackagesBucketName:
    Description: Content hub package bucket name.
    Value:
      Ref: ContentHubPackagesBucket
